name: CI/CD Deploy Aplikasi Baitulmal Aceh Tengah

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      - name: Build and push client image
        run: |
          docker build -t muammar88/baitulmal_client:${{ github.sha }} ./client
          docker push muammar88/baitulmal_client:${{ github.sha }}

      - name: Build and push backend image
        run: |
          docker build --target production -t muammar88/baitulmal_server:${{ github.sha }} ./server
          docker push muammar88/baitulmal_server:${{ github.sha }}

      - name: Build and push migration image
        run: |
          docker build --target migration -t muammar88/baitulmal_migrate:${{ github.sha }} ./server
          docker push muammar88/baitulmal_migrate:${{ github.sha }}

      - name: Deploy to Ubuntu server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IP_SERVER_OUTLETPULSA }}
          username: ${{ secrets.SSH_USER_OUTLETPULSA }}
          key: ${{ secrets.SSH_PRIVATE_KEY_OUTLETPULSA }}
          script: |
            set -e

            cd /home/outletpulsa/baitulmalacehtengah

            export CLIENT_IMAGE=muammar88/baitulmal_client:${{ github.sha }}
            export SERVER_IMAGE=muammar88/baitulmal_server:${{ github.sha }}
            export MIGRATE_IMAGE=muammar88/baitulmal_migrate:${{ github.sha }}

            docker pull "$CLIENT_IMAGE"
            docker pull "$SERVER_IMAGE"
            docker pull "$MIGRATE_IMAGE"

            # Never drop the production database during deployment.
            docker compose up -d mysql
            docker compose --profile tools run --rm migrate
            docker compose up -d --force-recreate server client phpmyadmin

            until [ "$(docker inspect -f '{{.State.Health.Status}}' Container_server_baitulmal)" == "healthy" ]; do
              echo "Waiting for backend health check..."
              sleep 5
            done

            echo "Deployment completed successfully."
